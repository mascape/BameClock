<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>GAME CLOCK</title>

<style>
:root{
  --bg:#111111;
  --text:#ffffff;
  --yellow:#ffd400;
  --red:#ff3b30;
  --blue:#6ecbff;
  --navy:#132033;

  --button:#262626;
  --buttonBorder:#444444;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:var(--bg);
  color:var(--text);

  font-family:
    "Arial Rounded MT Bold",
    "Hiragino Maru Gothic ProN",
    "Rounded Mplus 1c",
    "Yu Gothic UI",
    "Meiryo",
    sans-serif;

  font-weight:700;

  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   APP
========================= */

#app{
  width:100%;
  height:100%;
}

.main-screen{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  padding:2vh 3vw;
}

/* =========================
   ROTATE MESSAGE
========================= */

.rotate-message{
  display:none;

  width:100%;
  height:100%;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  text-align:center;

  gap:20px;

  font-size:7vw;
}

.rotate-message small{
  font-size:4vw;
  opacity:.7;
}

/* =========================
   TOP
========================= */

.top{
  min-height:8vh;

  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.game-count{
  font-size:4vw;
  letter-spacing:.08em;
}

/* =========================
   CENTER
========================= */

.center{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;
}

.mode{
  font-size:5vw;
  letter-spacing:.15em;

  margin-bottom:2vh;
}

/* =========================
   TIMER
========================= */

.timer{

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:
    "Arial Rounded MT Bold",
    "Trebuchet MS",
    sans-serif;

  font-size:24vw;

  line-height:1;

  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";

  font-weight:700;

  width:100%;

  white-space:nowrap;

  letter-spacing:0;

  transition:
    color .25s ease,
    transform .25s ease;

  transform-origin:center center;

  transform:translateZ(0);

  margin:auto;
}

/* =========================
   BREAK MODE
========================= */

.break-mode{
  background:var(--navy);
}

.break-mode .timer{
  color:var(--blue);
}

/* =========================
   FLASH
========================= */

.flash-red{
  animation:bgFlashRed .4s infinite;
}

.flash-blue{
  animation:bgFlashBlue .4s infinite;
}

/* =========================
   BUTTONS
========================= */

.buttons{
  display:flex;
  justify-content:center;

  gap:20px;

  margin-bottom:2vh;
}

button{
  border:none;

  border-radius:18px;

  padding:16px 26px;

  background:var(--button);

  color:#fff;

  border:2px solid var(--buttonBorder);

  font-size:4vw;
  font-weight:700;

  min-width:24vw;

  cursor:pointer;

  transition:
    transform .1s,
    opacity .2s;
}

button:active{
  transform:scale(.97);
}

button:hover{
  opacity:.9;
}

.start-button{
  width:100%;

  margin-top:2vh;

  background:#ffffff;
  color:#000000;

  font-size:5vw;
}

.count-reset{
  width:100%;
  margin-top:1vh;

  background:#3b3b3b;
}

/* =========================
   SETUP
========================= */

.setup{
  border-top:1px solid #333;

  padding-top:2vh;
}

.section{
  margin-bottom:2vh;
}

.section-title{
  font-size:3.8vw;

  margin-bottom:1vh;

  opacity:.9;
}

.option-row{
  display:flex;

  gap:12px;

  flex-wrap:wrap;
}

.option{
  flex:1;

  text-align:center;

  padding:14px 0;

  border-radius:999px;

  border:2px solid #555;

  background:#1d1d1d;

  color:#aaa;

  font-size:4vw;

  cursor:pointer;

  transition:
    background .2s,
    color .2s,
    border-color .2s;
}

.option.active{
  background:#ffffff;
  color:#000000;
  border-color:#ffffff;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  font-size:3vw;

  opacity:.5;

  margin-top:1vh;
}

/* =========================
   UTIL
========================= */

.hidden{
  display:none !important;
}

/* =========================
   LANDSCAPE
========================= */

@media (orientation:landscape){

  .timer{
    font-size:38vw;
    width:5.4ch;
  }

  .timer.large{
    font-size:42vw;
  }

  .mode{
    font-size:3vw;
  }

  .game-count{
    font-size:2.2vw;
  }

  button{
    font-size:2.4vw;
    min-width:14vw;
  }

  .section-title{
    font-size:2vw;
  }

  .option{
    font-size:2.2vw;
  }

  .footer{
    font-size:1.5vw;
  }
}

/* =========================
   ANIMATION
========================= */

@keyframes blink{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.45;
  }
}

@keyframes bgFlashRed{
  0%,100%{
    background:#220000;
  }

  50%{
    background:#660000;
  }
}

@keyframes bgFlashBlue{
  0%,100%{
    background:#001b33;
  }

  50%{
    background:#004477;
  }
}
</style>
</head>

<body>

<!-- ROTATE -->

<div id="rotateMessage" class="rotate-message">

  <div>📱↔</div>

  <div>横向きにしてください</div>

  <small>Landscape Recommended</small>

</div>

<!-- APP -->

<div id="app">

  <div class="main-screen" id="mainScreen">

    <!-- TOP -->

    <div class="top">

      <div class="game-count" id="gameCountLabel">
        GAME 1
      </div>

    </div>

    <!-- CENTER -->

    <div class="center">

      <div class="mode" id="modeLabel">
        READY
      </div>

      <div class="timer" id="timerDisplay">
        6:00
      </div>

    </div>

    <!-- CONTROL -->

    <div class="buttons" id="controlButtons">

      <button id="pauseBtn" class="hidden">
        PAUSE
      </button>

      <button id="resetBtn" class="hidden">
        RESET
      </button>

    </div>

    <!-- SETUP -->

    <div class="setup" id="setupPanel">

      <!-- GAME TIME -->

      <div class="section">

        <div class="section-title">
          GAME TIME
        </div>

        <div class="option-row">

          <div class="option" data-game="5">5</div>
          <div class="option active" data-game="6">6</div>
          <div class="option" data-game="7">7</div>
          <div class="option" data-game="8">8</div>
          <div class="option" data-game="10">10</div>

        </div>

      </div>

      <!-- BREAK TIME -->

      <div class="section">

        <div class="section-title">
          BREAK TIME
        </div>

        <div class="option-row">

          <div class="option active" data-break="2">2</div>
          <div class="option" data-break="3">3</div>
          <div class="option" data-break="4">4</div>

        </div>

      </div>

      <!-- START -->

      <button class="start-button" id="startBtn">
        START
      </button>

      <!-- COUNT RESET -->

      <button class="count-reset" id="countResetBtn">
        COUNT RESET
      </button>

      <div class="footer">
        Designed for Basketball
      </div>

    </div>

  </div>

</div>

<!-- AUDIO -->

<audio id="warning1" src="warning1.mp3" preload="auto"></audio>
<audio id="warning2" src="warning2.mp3" preload="auto"></audio>
<audio id="finish" src="finish.mp3" preload="auto"></audio>

<script>
/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY = "basketball_game_clock_v1";

/* =========================================
   STATE
========================================= */

const state = {

  mode:"READY",

  gameMinutes:6,

  breakMinutes:2,

  gameCount:1,

  remaining:360,

  running:false,

  timerId:null,

  lastTick:0,

  warning60Played:false,

  warning15Played:false,

  wakeLock:null
};

/* =========================================
   ELEMENTS
========================================= */

const timerDisplay =
  document.getElementById("timerDisplay");

const modeLabel =
  document.getElementById("modeLabel");

const gameCountLabel =
  document.getElementById("gameCountLabel");

const pauseBtn =
  document.getElementById("pauseBtn");

const resetBtn =
  document.getElementById("resetBtn");

const setupPanel =
  document.getElementById("setupPanel");

const rotateMessage =
  document.getElementById("rotateMessage");

const mainScreen =
  document.getElementById("mainScreen");

const warning1 =
  document.getElementById("warning1");

const warning2 =
  document.getElementById("warning2");

const finish =
  document.getElementById("finish");

/* =========================================
   SAVE / LOAD
========================================= */

function saveSettings(){

  localStorage.setItem(
    STORAGE_KEY,

    JSON.stringify({

      gameMinutes:state.gameMinutes,

      breakMinutes:state.breakMinutes,

      gameCount:state.gameCount
    })
  );
}

function loadSettings(){

  const data =
    localStorage.getItem(STORAGE_KEY);

  if(!data) return;

  const parsed = JSON.parse(data);

  state.gameMinutes =
    parsed.gameMinutes || 6;

  state.breakMinutes =
    parsed.breakMinutes || 2;

  state.gameCount =
    parsed.gameCount || 1;

  updateOptionUI();
}

/* =========================================
   OPTION UI
========================================= */

function updateOptionUI(){

  document
    .querySelectorAll("[data-game]")
    .forEach(el=>{

      el.classList.remove("active");

      if(
        Number(el.dataset.game)
        ===
        state.gameMinutes
      ){
        el.classList.add("active");
      }
    });

  document
    .querySelectorAll("[data-break]")
    .forEach(el=>{

      el.classList.remove("active");

      if(
        Number(el.dataset.break)
        ===
        state.breakMinutes
      ){
        el.classList.add("active");
      }
    });

  gameCountLabel.textContent =
    `GAME ${state.gameCount}`;

  if(state.mode === "READY"){

    timerDisplay.textContent =
      formatMainTime(
        state.gameMinutes * 60
      );
  }
}

/* =========================================
   FORMAT
========================================= */

function formatMainTime(sec){

  if(sec <= 60){

    return sec.toFixed(1);
  }

  const m =
    Math.floor(sec / 60);

  const s =
    Math.floor(sec % 60);

  return `${m}:${String(s).padStart(2,"0")}`;
}

/* =========================================
   DISPLAY
========================================= */

function updateDisplay(){

  timerDisplay.className = "timer";

  if(state.remaining <= 60){

    timerDisplay.classList.add("large");
  }

  if(state.mode === "BREAK"){

    document.body.classList.add("break-mode");

  }else{

    document.body.classList.remove("break-mode");
  }

  if(state.mode === "GAME"){

    if(state.remaining <= 60){

      timerDisplay.classList.add("warning");
    }

    if(state.remaining <= 15){

      timerDisplay.classList.remove("warning");

      timerDisplay.classList.add("danger");
    }
  }

  timerDisplay.textContent =
    formatMainTime(state.remaining);
}

/* =========================================
   START GAME
========================================= */

function startGame(){

  state.mode = "GAME";

  state.remaining =
    state.gameMinutes * 60;

  state.warning60Played = false;

  state.warning15Played = false;
  
  modeLabel.textContent = "GAME";

  modeLabel.style.display = "none";

  setupPanel.classList.add("hidden");

  pauseBtn.classList.remove("hidden");

  resetBtn.classList.remove("hidden");

  pauseBtn.textContent = "PAUSE";

  runTimer();
}

/* =========================================
   START BREAK
========================================= */

function startBreak(){

  state.mode = "BREAK";

  state.remaining =
    state.breakMinutes * 60;

  modeLabel.textContent = "BREAK";

  modeLabel.style.display = "none";

  runTimer();
}

/* =========================================
   TIMER
========================================= */

function runTimer(){

  clearInterval(state.timerId);

  state.running = true;

  state.lastTick = performance.now();

  state.timerId = setInterval(()=>{

    const now = performance.now();

    const delta =
      (now - state.lastTick) / 1000;

    state.lastTick = now;

    state.remaining -= delta;

    /* 60 SEC */

    if(
      state.mode === "GAME"
      &&
      state.remaining <= 60
      &&
      !state.warning60Played
    ){

      warning1.currentTime = 0;

      warning1.play();

      state.warning60Played = true;
    }

    /* 15 SEC */

    if(
      state.mode === "GAME"
      &&
      state.remaining <= 15
      &&
      !state.warning15Played
    ){

      warning2.currentTime = 0;

      warning2.play();

      state.warning15Played = true;
    }

    /* FINISH */

    if(state.remaining <= 0){

      state.remaining = 0;

      updateDisplay();

      clearInterval(state.timerId);

      state.running = false;

      handleFinish();

      return;
    }

    updateDisplay();

  },100);
}

/* =========================================
   FINISH
========================================= */

function handleFinish(){

  finish.currentTime = 0;

  finish.play();

  /* GAME END */

  if(state.mode === "GAME"){

    state.gameCount++;

    saveSettings();

    modeLabel.textContent = "GAME SET";

    document.body.classList.add("flash-red");

    timerDisplay.textContent = "0.0";

    setTimeout(()=>{

      document.body.classList.remove("flash-red");

      gameCountLabel.textContent =
        `GAME ${state.gameCount}`;

      startBreak();

    },2000);
  }

  /* BREAK END */

  else if(state.mode === "BREAK"){

    modeLabel.textContent = "READY?";

    document.body.classList.add("flash-blue");

    timerDisplay.textContent = "0.0";

    setTimeout(()=>{

      document.body.classList.remove("flash-blue");

      returnReady();

    },2000);
  }
}

/* =========================================
   READY
========================================= */

function returnReady(){

  state.mode = "READY";

  clearInterval(state.timerId);

  state.running = false;

  pauseBtn.classList.add("hidden");

  resetBtn.classList.add("hidden");

  setupPanel.classList.remove("hidden");

  modeLabel.style.display = "block";
  modeLabel.textContent = "READY";

  state.remaining =
    state.gameMinutes * 60;

  updateDisplay();

  saveSettings();
}

/* =========================================
   BUTTON EVENTS
========================================= */

/* PAUSE */

pauseBtn.addEventListener("click",()=>{

  if(!state.running){

    runTimer();

    pauseBtn.textContent = "PAUSE";

    return;
  }

  clearInterval(state.timerId);

  state.running = false;

  pauseBtn.textContent = "RESUME";
});

/* RESET */

resetBtn.addEventListener("click",()=>{

  const ok =
    confirm("READYへ戻しますか？");

  if(!ok) return;

  returnReady();

  pauseBtn.textContent = "PAUSE";
});

/* START */

document
  .getElementById("startBtn")
  .addEventListener("click", async ()=>{

    try{

      if("wakeLock" in navigator){

        state.wakeLock =
          await navigator.wakeLock
          .request("screen");
      }

    }catch(e){}

    startGame();
  });

/* COUNT RESET */

document
  .getElementById("countResetBtn")
  .addEventListener("click",()=>{

    const ok =
      confirm(
        "GAME COUNT をリセットしますか？"
      );

    if(!ok) return;

    state.gameCount = 1;

    saveSettings();

    updateOptionUI();
  });

/* GAME TIME */

document
  .querySelectorAll("[data-game]")
  .forEach(el=>{

    el.addEventListener("click",()=>{

      state.gameMinutes =
        Number(el.dataset.game);

      saveSettings();

      updateOptionUI();
    });
  });

/* BREAK TIME */

document
  .querySelectorAll("[data-break]")
  .forEach(el=>{

    el.addEventListener("click",()=>{

      state.breakMinutes =
        Number(el.dataset.break);

      saveSettings();

      updateOptionUI();
    });
  });

/* =========================================
   ORIENTATION
========================================= */

function checkOrientation(){

  const portrait =
    window.innerHeight
    >
    window.innerWidth;

  if(portrait){

    rotateMessage.style.display = "flex";

    mainScreen.style.display = "none";

  }else{

    rotateMessage.style.display = "none";

    mainScreen.style.display = "flex";
  }
}

window.addEventListener(
  "resize",
  checkOrientation
);

/* =========================================
   INIT
========================================= */

loadSettings();

state.remaining =
  state.gameMinutes * 60;

updateDisplay();

checkOrientation();
</script>

<script>

if("serviceWorker" in navigator){

  navigator.serviceWorker
    .register("./sw.js")

    .then(()=>{

      console.log("Service Worker Registered");
    });
}

</script>

</body>
</html>
